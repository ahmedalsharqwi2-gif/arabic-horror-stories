{
  "name": "Read-only bounded horror failed-run diagnostics",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "codex/rebuild-production-v2"
      ],
      "paths": [
        ".github/production-v2-diagnostic-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "jobs": {
    "diagnose": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests"
        },
        {
          "run": "python - <<'PYREQUEST'\nimport json,subprocess\nfrom pathlib import Path\nr=json.loads(Path('.github/production-v2-diagnostic-request.json').read_text())\nif r.get('profile')!='horror':raise ValueError('Wrong diagnostic repository')\nsubprocess.run(['python','-m','production_v2.diagnose','--profile','horror','--target-run',str(r['target_run'])],check=True)\nPYREQUEST"
        }
      ]
    }
  }
}
