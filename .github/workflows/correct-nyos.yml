{
  "name": "Correct reviewed Nyos episode and verify delivery",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/correct-nyos.yml"
      ]
    }
  },
  "permissions": {
    "contents": "write",
    "actions": "read"
  },
  "concurrency": {
    "group": "horror-episode-pipeline",
    "cancel-in-progress": false
  },
  "jobs": {
    "produce-and-publish": {
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish factually corrected Nyos episode' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "env": {
        "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "BUFFER_CHANNEL_ID": "${{ secrets.BUFFER_CHANNEL_ID }}",
        "BUFFER_YOUTUBE_CHANNEL_ID": "${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}",
        "BUFFER_FACEBOOK_CHANNEL_ID": "${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}",
        "BUFFER_INSTAGRAM_CHANNEL_ID": "${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}",
        "BUFFER_TIKTOK_CHANNEL_ID": "${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "GEMINI_TEXT_API_KEY": "${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}",
        "GEMINI_TTS_API_KEY": "${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}",
        "BUFFER_CHANNEL_IDS": "${{ secrets.BUFFER_CHANNEL_IDS || vars.BUFFER_CHANNEL_IDS }}",
        "GITHUB_TOKEN": "${{ github.token }}",
        "PYTHONPATH": "${{ github.workspace }}",
        "PYTHONUNBUFFERED": "1",
        "CHANNEL_BRAND": "ملفات غامضه",
        "PUBLICATION_RECEIPTS_ENABLED": "true",
        "BUFFER_SCHEDULE_MODE": "customScheduled",
        "PUBLISH_IMMEDIATE": "true",
        "PRODUCTION_MEDIA_ID": "documented-nyos-corrected-v2",
        "USE_APPROVED_SAMPLE": "false",
        "FIRST_APPROVED_PUBLISH": "false",
        "FILM_SOURCE_PLAN": "config/reviewed_episodes/nyos.json"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "main"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install lightweight dependencies",
          "run": "python -m pip install requests Pillow numpy beautifulsoup4"
        },
        {
          "uses": "actions/cache/restore@v4",
          "with": {
            "path": ".voice_cache\n.image_cache\n.film_work\nstate/api_budget.sqlite3\n~/.cache/huggingface",
            "key": "nyos-corrected-v2-${{ github.repository_id }}-${{ github.run_id }}",
            "restore-keys": "documented-factory-v2-${{ github.repository_id }}-"
          }
        },
        {
          "name": "Restore original verified render inputs only",
          "uses": "actions/download-artifact@v4",
          "with": {
            "name": "horror-daily-cinema-39691195356",
            "run-id": 39691195356,
            "github-token": "${{ github.token }}",
            "path": ".resume"
          }
        },
        {
          "name": "Keep repository receipts and replace stale output",
          "run": "rm -rf output\ncp -a .resume/output output\nrm -f output/final_video_full.mp4 output/publication-result.json"
        },
        {
          "name": "Install encoding dependencies",
          "run": "sudo apt-get update -qq\nsudo apt-get install -y ffmpeg fonts-dejavu-core\npython -m pip install google-api-python-client google-auth-oauthlib"
        },
        {
          "name": "Install alignment only when generating new speech",
          "run": "python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu\npython -m pip install -r film_factory/requirements.txt"
        },
        {
          "name": "Regenerate complete Charon speech from manually checked factual text",
          "run": "python -m film_factory.produce horror"
        },
        {
          "name": "Hide incorrect YouTube version and audit actual social status",
          "run": "python scripts/nyos_publication_correction.py"
        },
        {
          "name": "Publish corrected full verified video",
          "run": "python -m film_factory.publish horror"
        },
        {
          "name": "Audit actual provider state",
          "if": "always()",
          "run": "python scripts/audit_publication_delivery.py"
        },
        {
          "name": "Preserve corrected complete video and evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "nyos-corrected-${{ github.run_id }}",
            "path": "output/\nstate/publication_stock.json",
            "retention-days": 30
          }
        },
        {
          "name": "Persist actual receipts and topic history even after partial failure",
          "if": "always()",
          "run": "git config user.name content-bot\ngit config user.email bot@users.noreply.github.com\nfor path in state/publication_stock.json state/film_topics.json state/yt_token_last_success.json state/news_history.json; do\n  if [ -f \"$path\" ]; then git add \"$path\"; fi\ndone\nif git diff --cached --quiet; then exit 0; fi\ngit commit -m 'Persist daily video and actual publication receipts [skip ci]'\nfor attempt in 1 2 3; do\n  if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi\n  sleep 3\ndone\nexit 1"
        }
      ]
    }
  }
}