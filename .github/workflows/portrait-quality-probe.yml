{
  "name": "Portrait realism test — no publication",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/portrait-quality-probe.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "jobs": {
    "portrait-images": {
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Test portrait art direction without publication' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "CLOUDFLARE_API_TOKEN": "${{ secrets.CLOUDFLARE_API_TOKEN }}",
        "CLOUDFLARE_ACCOUNT_ID": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests Pillow"
        },
        {
          "name": "Generate two actual portrait photographs",
          "run": "python scripts/portrait_quality_probe.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "portrait-realism-${{ github.run_id }}",
            "path": "output/portrait-probe/",
            "retention-days": 30
          }
        }
      ]
    },
    "hide-superseded-and-audit": {
      "if": "${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Test portrait art direction without publication' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "env": {
        "BUFFER_API_KEY": "${{ secrets.BUFFER_API_KEY }}",
        "YT_CLIENT_ID": "${{ secrets.YT_CLIENT_ID }}",
        "YT_CLIENT_SECRET": "${{ secrets.YT_CLIENT_SECRET }}",
        "YT_REFRESH_TOKEN": "${{ secrets.YT_REFRESH_TOKEN }}",
        "YT_REFRESH_TOKEN_FALLBACK": "${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}",
        "PYTHONPATH": "${{ github.workspace }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "run": "python -m pip install requests Pillow numpy google-api-python-client google-auth-oauthlib"
        },
        {
          "run": "mkdir -p output\npython scripts/nyos_publication_correction.py"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "superseded-version-audit-${{ github.run_id }}",
            "path": "output/",
            "retention-days": 30
          }
        }
      ]
    }
  }
}