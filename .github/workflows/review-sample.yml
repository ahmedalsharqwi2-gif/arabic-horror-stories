name: Review sample — no social publishing
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/review-sample.yml
permissions:
  contents: write
  issues: write
jobs:
  sample:
    uses: ./.github/workflows/main.yml
    with:
      dry_run: true
      source_backed_sample: true
    secrets: inherit

