name: Create and Publish True Horror Episode

on:
  schedule:
    # Prepare at 06:00/12:00 UTC, at least three hours before Cairo publication.
    # Final publication remains 12:00 and 18:00 Africa/Cairo, including DST changes.
    - cron: "17 6 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing externally"
        required: false
        default: false
        type: boolean
      publish_now:
        description: "انشر فورًا لتعويض موعد فائت"
        required: false
        default: false
        type: boolean

# Actions v5/v6 already target Node.js 24. Keep this explicit so GitHub does
# not fall back to the deprecated Node.js 20 runtime for any transitive action.
env:
  QUALITY_GATES_BLOCKING: 'false'
  CLIP_REVIEW_ENABLED: 'false'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}
  BACKGROUND_MUSIC_ENABLED: 'true'
  # Consecutive production runs cycle 1 -> 2 -> 3; retries keep the same track.
  MUSIC_ROTATION_INDEX: ${{ github.run_number }}
  BACKGROUND_MUSIC_VOLUME: '0.12'

# يمنع تشغيل حلقتين في الوقت نفسه، ولا يلغي التشغيل الجاري.
concurrency:
  group: horror-episode-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Set final Cairo publication slot
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          PUBLISH_NOW: ${{ inputs.publish_now || false }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          cairo_now = now.astimezone(ZoneInfo("Africa/Cairo"))
          if os.environ.get("PUBLISH_NOW", "false").lower() == "true":
              target = datetime.now(timezone.utc) + timedelta(minutes=2)
              due_at = target.isoformat(timespec="seconds").replace("+00:00", "Z")
              print(f"Immediate catch-up publication slot: {due_at} UTC")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
              raise SystemExit(0)
          target_hour = {"17 6 * * *": 12, "17 12 * * *": 18}.get(os.environ.get("SCHEDULE_EXPR", ""))
          if target_hour is None:
              slots = [cairo_now.replace(hour=12, minute=0, second=0, microsecond=0),
                       cairo_now.replace(hour=18, minute=0, second=0, microsecond=0)]
              target = next((slot for slot in slots if slot > cairo_now), slots[0] + timedelta(days=1))
          else:
              target = cairo_now.replace(hour=target_hour, minute=0, second=0, microsecond=0)
              if target <= cairo_now:
                  # A delayed morning run should still reach today's evening
                  # slot instead of being rolled to tomorrow's noon.
                  slots = [cairo_now.replace(hour=12, minute=0, second=0, microsecond=0),
                           cairo_now.replace(hour=18, minute=0, second=0, microsecond=0)]
                  target = next((slot for slot in slots if slot > cairo_now),
                                slots[0] + timedelta(days=1))
          due_at = target.astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
          print(f"Final Cairo publication slot: {target.isoformat()} ({due_at} UTC)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PUBLISH_DUE_AT={due_at}\n")
          PY

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Load the latest topic/clip history after the preceding job finishes.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and resolve AI model policy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_POLICY_FILE: config/model_policy.json
        run: python scripts/model_preflight.py

      - name: Generate complete episode script
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          GEMINI_THINKING_BUDGET: "0"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Gemini -> Groq first; OpenRouter is the last resort because its
          # free quota may be exhausted and must not delay every episode.
          PREFER_OPENROUTER: "false"
          LLM_RETRIES: "2"
          LLM_INVALID_RETRIES: "4"
          LLM_DEADLINE_SECONDS: "900"
          LLM_REQUEST_TIMEOUT: "120"
          # Documentary horror episodes are 230–320 words and are later
          # excerpted into one reel capped below 90 seconds.
          NARRATION_WORDS_MIN: "230"
          NARRATION_WORDS_MAX: "320"
          LLM_INITIAL_BUDGET: "8000"
          # Duplicate topics are rejected, then the next round is explicitly
          # required to choose a completely different incident and hook.
          LLM_ROUNDS: "3"
          LLM_ROUND_COOLDOWN: "10"
          TOPIC_SELECTION_MODE: "dynamic"
          TOPIC_ROTATION_SEED: ${{ github.run_id }}
          TOPIC_PERFORMANCE_FILE: "state/topic_performance.json"
        run: python scripts/generate_script.py

      - name: Arabic preflight gates (horror)
        env:
          EDGE_TTS_VOICE: "ar-SA-ZariyahNeural"
          TTS_ENGINE: "edge"
        run: |
          test -f state/current_episode.json || { echo "TEXT_GATE: episode artifact missing"; exit 1; }
          TEXT=$(python -c "import json; print(json.load(open('state/current_episode.json', encoding='utf-8')).get('narration',''))")
          python -m arabic_speech_core.cli preflight --text "$TEXT" --engine edge --locale ar-SA --voice "$EDGE_TTS_VOICE" --lexicon config/arabic_pronunciation.json --min-words 20 --max-words 1200

      - name: Fetch landscape stock clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/fetch_clips.py

      - name: Generate complete narration with automatic SILMA horror voice and landscape subtitles
        env:
          TTS_ENGINE: "edge"
          EDGE_TTS_VOICES: "ar-SA-ZariyahNeural"
          EDGE_TTS_VOICE: "ar-SA-ZariyahNeural"
          SILMA_REFERENCE_PROFILE: "auto"
          SILMA_VOICE_PROFILES_FILE: "assets/voices/voice_profiles.json"
          AUTO_VOICE_PROFILES: "hossam,hossam_uploaded,marwan,nassim,ahmed_z"
          SILMA_SPEED: "1.00"
          SILMA_GUARD_ENABLED: "true"
          SILMA_GUARD_MIN_MATCH_WORDS: "3"
          SILMA_FALLBACK_TO_EDGE: "true"
          WHISPER_MODEL: "base"
          # Whisper can miss diacritics and proper names; keep empty/
          # foreign-audio checks while allowing minor alignment differences.
          ASR_MIN_MATCH_RATIO: "0.60"
          EDGE_TTS_RATE: "-8%"
          EDGE_TTS_PITCH: "-3Hz"
        run: python scripts/generate_voice.py

      - name: Assemble full landscape video and single vertical reel
        run: python scripts/assemble_video.py

      - name: Verify final montage and B-roll output
        run: |
          test -s output/final_video_full.mp4 || { echo "ERROR: full montage missing or empty"; exit 1; }
          test -s state/fetched_clips.json || { echo "ERROR: B-roll tracking manifest missing"; exit 1; }
          test "$(python -c 'import json; print(len(json.load(open("state/fetched_clips.json"))))')" -ge 1 || { echo "ERROR: no usable visual assets"; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video_full.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video_full.mp4
          echo "Professional landscape montage with topic-specific B-roll verified."
          for reel in output/short_*.mp4; do
            test -s "$reel" || { echo "ERROR: reel missing or empty: $reel"; exit 1; }
            duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$reel")
            python - "$duration" "$reel" <<'PY'
          import sys
          duration = float(sys.argv[1])
          path = sys.argv[2]
          if duration > 89.0:
              raise SystemExit(f"ERROR: reel exceeds safe 90-second limit: {path} ({duration:.2f}s)")
          print(f"Reel duration verified: {path} {duration:.2f}s")
          PY
          done

      - name: Reserve unique topic before external publication
        if: ${{ inputs.dry_run != true }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py reserve --file state/topic_history.json --episode state/current_episode.json

      - name: Publish full video and reel together
        if: ${{ inputs.dry_run != true }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # نفس القيمة تُستخدم للفيديو الكامل وللريل معًا، عشان ينشروا
          # سوا الساعة ~7م. غيّرها هنا لو غيّرت معاد الـ cron فوق.
          FULL_VIDEO_DELAY_HOURS: "8"
          CHANNEL_PENDING_LIMIT: "10"
        run: python scripts/publish_buffer.py

      # Buffer لا يدعم فيديوهات يوتيوب الطويلة (Long-form) إطلاقًا — يدعم
      # YouTube Shorts فقط، لذلك الفيديو الكامل يُنشر ليوتيوب هنا بشكل
      # منفصل عبر YouTube Data API مباشرة (شوف publish_youtube_direct.py).
      # FULL_VIDEO_DELAY_HOURS لازم تكون نفس قيمة الخطوة اللي فاتت، عشان
      # يوتيوب ينشر في نفس توقيت باقي المنصات (والريل) مساءً.
      - name: Publish full video directly to YouTube
        if: ${{ inputs.dry_run != true }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
          FULL_VIDEO_DELAY_HOURS: "8"
        run: python scripts/publish_youtube_direct.py

      - name: Mark topic as published in repository history
        if: ${{ inputs.dry_run != true }}
        env:
          TOPIC_HISTORY_COMMIT: "true"
        run: python scripts/topic_history.py mark-published --file state/topic_history.json --episode state/current_episode.json

      # تحذير مبكر قبل انتهاء صلاحية YT_REFRESH_TOKEN (7 أيام لتطبيق في
      # وضع Testing عند Google) — بيفتح GitHub Issue قبل الموعد بأيام
      # أمان بدل ما ننتظر فشل النشر فعليًا. يشتغل دايمًا (always())، حتى
      # لو الخطوة اللي فاتت فشلت، عشان يفضل يقرأ آخر تاريخ نجاح معروف.
      - name: Check YouTube token age
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_youtube_token_age.py

      - name: Upload generated media artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: true-horror-episode-media-${{ github.run_id }}
          path: |
            output/final_video_full.mp4
            output/short_*.mp4
            state/current_episode.json
          retention-days: 14
          if-no-files-found: error

      - name: Commit clip tracking state only
        run: |
          git config user.name "content-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/used_clips.json state/yt_token_last_success.json
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير في حالة الكليبات"
            exit 0
          fi
          git commit -m "chore: update used clips tracking [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "إعادة محاولة push رقم $attempt"
            sleep $((attempt * 5))
          done
          echo "فشل push بعد 5 محاولات"
          exit 1

      - name: Preserve clip review candidates
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: clip-review-candidates
          path: |
            state/clip_review_requests.json
            state/clip_reviews.json
            downloaded_clips/clip_*.mp4
            output/pexels_clips/raw_*
          if-no-files-found: ignore
          retention-days: 3
