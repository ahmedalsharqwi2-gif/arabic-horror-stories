name: Daily Horror — 17:00 Cairo
run-name: Daily 17:00 Cairo — ${{ github.run_number }}
'on':
  workflow_dispatch:
    inputs:
      source_backed_sample:
        type: boolean
        required: false
        default: false
      dry_run:
        description: Produce and validate without social publishing
        required: false
        default: false
        type: boolean
  schedule:
  - cron: 10 13 * * *
    timezone: Africa/Cairo
  workflow_call:
    inputs:
      source_backed_sample:
        type: boolean
        required: false
        default: false
      dry_run:
        required: false
        default: false
        type: boolean
env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_TEXT_API_KEY: ${{ secrets.GEMINI_TEXT_API_KEY || secrets.GEMINI_API_KEY }}
  GEMINI_TTS_API_KEY: ${{ secrets.GEMINI_TTS_API_KEY || secrets.GEMINI_API_KEY }}
  CINEMATIC_ENABLED: 'true'
  CINEMATIC_FREE_ONLY: 'true'
  CINEMATIC_PAID_ENABLED: 'false'
  CINEMATIC_VIDEO_ENABLED: 'false'
  CINEMATIC_EPISODE_BUDGET_USD: '0'
  CINEMATIC_DAILY_BUDGET_USD: '0'
  CINEMATIC_IMAGE_MODEL: ${{ vars.CINEMATIC_IMAGE_MODEL || 'gemini-3.1-flash-lite-image' }}
  CINEMATIC_IMAGE_FALLBACK_MODEL: ${{ vars.CINEMATIC_IMAGE_FALLBACK_MODEL || 'gemini-3.1-flash-image' }}
  QUALITY_GATES_BLOCKING: 'false'
  CLIP_REVIEW_ENABLED: 'false'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}
  BACKGROUND_MUSIC_ENABLED: 'true'
  MUSIC_ROTATION_INDEX: ${{ github.run_number }}
  BACKGROUND_MUSIC_VOLUME: '0.12'
  CINEMATIC_MOTION_ONLY: 'true'
concurrency:
  group: horror-episode-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  build-and-publish:
    env:
      PUBLICATION_RECEIPTS_ENABLED: 'true'
      PUBLISH_IMMEDIATE: 'false'
      PRODUCTION_MEDIA_ID: ${{ github.run_id }}
      BUFFER_SCHEDULE_MODE: customScheduled
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        ref: main
    - name: Select the unique 17:00 Cairo slot
      id: daily
      run: python scripts/daily_schedule.py
    - name: Restore verified voices and API budget
      uses: actions/cache/restore@v4
      with:
        path: '.voice_cache

          state/api_budget.sqlite3'
        key: voice-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: voice-budget-${{ github.repository_id }}-
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Validate Python syntax before expensive production
      run: python3 -m compileall -q scripts arabic_speech_core
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Restore prepared text for this publication slot
      id: prepared_text
      uses: actions/cache/restore@v4
      with:
        path: state/current_episode.json
        key: prepared-v4-${{ inputs.source_backed_sample || false }}-${{ github.repository_id }}-${{ inputs.dry_run || false }}-${{ env.PUBLISH_DATE || github.run_id }}-${{ env.PUBLISH_HOUR }}
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Check source identity before resuming a review script
      if: ${{ inputs.source_backed_sample }}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        p=Path("state/current_episode.json")
        if p.exists():
            try:
                d=json.loads(p.read_text(encoding="utf-8"))
                valid=d.get("editorial_review",{}).get("source")=="https://www.smithsonianmag.com/history/abandoned-ship-the-mary-celeste-174488104/"
            except (ValueError, TypeError, AttributeError):
                valid=False
            if not valid:
                p.unlink()
                print("Removed a checkpoint from a different editorial source")
        PY
    - name: Validate restored text against current topic history
      id: checked_text
      run: python scripts/check_prepared_text.py --path state/current_episode.json --history state/topic_history.json
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Restore inspected cinematic scenes
      if: ${{ (env.CINEMATIC_ENABLED == 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: .cinematic_cache
        key: cinematic-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PUBLISH_DATE }}-${{ env.PUBLISH_HOUR }}
        restore-keys: cinematic-v1-${{ github.repository_id }}-
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Install ffmpeg and Arabic fonts
      run: 'sudo apt-get update

        sudo apt-get install -y ffmpeg fonts-noto-core

        ffmpeg -version

        ffprobe -version

        '
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Install dependencies
      run: 'python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

        python -m pip install -r requirements.txt'
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Generate the source-backed mystery sample with Gemini
      run: python -m scripts.source_episode
      if: ${{ inputs.source_backed_sample && steps.checked_text.outputs.usable != 'true' && steps.daily.outputs.already_confirmed != 'true' }}
    - name: Validate and resolve AI model policy
      if: ${{ !inputs.source_backed_sample && (steps.checked_text.outputs.usable != 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY || secrets.GROQ_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LLM_FALLBACK_ENDPOINT: ${{ vars.LLM_FALLBACK_ENDPOINT || 'https://api.groq.com/openai/v1/chat/completions' }}
        LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        OPENROUTER_API_KEY: ''
        MODEL_POLICY_FILE: config/model_policy.json
      run: python scripts/model_preflight.py
    - name: Generate complete episode script
      if: ${{ !inputs.source_backed_sample && (steps.checked_text.outputs.usable != 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        PYTHONUNBUFFERED: '1'
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        GEMINI_THINKING_BUDGET: '0'
        OPENROUTER_API_KEY: ''
        PREFER_OPENROUTER: 'false'
        LLM_RETRIES: '2'
        LLM_INVALID_RETRIES: '4'
        LLM_DEADLINE_SECONDS: '900'
        LLM_REQUEST_TIMEOUT: '120'
        NARRATION_WORDS_MIN: '150'
        NARRATION_WORDS_MAX: '240'
        LLM_INITIAL_BUDGET: '8000'
        LLM_ROUNDS: '3'
        LLM_ROUND_COOLDOWN: '10'
        TOPIC_SELECTION_MODE: dynamic
        TOPIC_ROTATION_SEED: ${{ github.run_id }}
        TOPIC_PERFORMANCE_FILE: state/topic_performance.json
      run: python scripts/generate_script.py
    - name: Arabic preflight gates (horror)
      env:
        TTS_ENGINE: gemini
      run: 'test -f state/current_episode.json || { echo "TEXT_GATE: episode artifact missing"; exit 1; }

        TEXT=$(python -c "import json; print(json.load(open(''state/current_episode.json'', encoding=''utf-8'')).get(''narration'',''''))")

        python -m arabic_speech_core.cli preflight --text "$TEXT" --engine gemini --locale ar-EG --voice Charon --no-smoke --lexicon config/arabic_pronunciation.json --min-words 20 --max-words 1200

        '
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Save prepared text independently of later media failures
      if: ${{ (steps.checked_text.outputs.usable != 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: state/current_episode.json
        key: prepared-v4-${{ inputs.source_backed_sample || false }}-${{ github.repository_id }}-${{ inputs.dry_run || false }}-${{ env.PUBLISH_DATE || github.run_id }}-${{ env.PUBLISH_HOUR }}
    - name: Validate the approved Gemini Charon voice
      run: bash voice_provider/install.sh
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Generate complete narration with approved Gemini Charon and vertical subtitles
      env:
        TTS_ENGINE: gemini
        WHISPER_MODEL: small
        ASR_FALLBACK_MODEL: small
        ASR_MIN_MATCH_RATIO: '0.60'
      run: python scripts/generate_voice.py
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Assemble one complete vertical video
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: python scripts/assemble_video.py
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Verify final montage and B-roll output
      run: "test -s output/final_video_full.mp4 || { echo \"ERROR: full montage missing or empty\"; exit 1; }\ntest -s state/fetched_clips.json || { echo \"ERROR: B-roll tracking manifest missing\"; exit 1; }\ntest \"$(python -c 'import json; print(len(json.load(open(\"state/fetched_clips.json\"))))')\" -ge 1 || { echo \"ERROR: no usable visual assets\"; exit 1; }\ndimensions=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/final_video_full.mp4)\ntest \"$dimensions\" = \"1080,1920\" || { echo \"ERROR: horizontal output is forbidden; expected 1080x1920, got $dimensions\"; exit 1; }\nduration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/final_video_full.mp4)\npython - \"$duration\" <<'PY'\nimport sys\nduration = float(sys.argv[1])\nif not 0 < duration <= 180.0:\n    raise SystemExit(f\"ERROR: horror video must be no longer than 180 seconds, got {duration:.2f}s\")\nprint(f\"Vertical horror montage verified: {duration:.2f}s\")\nPY\n"
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Verify the last spoken words survive final mixing
      run: python -m scripts.verify_delivery output/final_video_full.mp4 downloaded_clips/narration.mp3
      if: ${{ steps.daily.outputs.already_confirmed != 'true' }}
    - name: Reserve unique topic before external publication
      if: ${{ (inputs.dry_run != true) && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        TOPIC_HISTORY_COMMIT: 'true'
      run: python scripts/topic_history.py reserve --file state/topic_history.json --episode state/current_episode.json
    - name: Publish the complete video only
      id: publish_buffer
      continue-on-error: true
      if: ${{ (inputs.dry_run != true) && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
        BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
        BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CHANNEL_PENDING_LIMIT: '10'
      run: python scripts/publish_buffer.py
    - name: Publish full video directly to YouTube
      id: publish_youtube
      continue-on-error: true
      if: ${{ (inputs.dry_run != true) && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        YT_REFRESH_TOKEN_FALLBACK: ${{ secrets.YT_REFRESH_TOKEN_FALLBACK }}
      run: python scripts/publish_youtube_direct.py
    - name: Confirm actual publication receipts
      if: ${{ (!inputs.dry_run) && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        BUFFER_OUTCOME: ${{ steps.publish_buffer.outcome }}
        YOUTUBE_OUTCOME: ${{ steps.publish_youtube.outcome }}
      run: python scripts/publication_state.py confirm
    - name: Mark topic as published in repository history
      if: ${{ (inputs.dry_run != true) && steps.daily.outputs.already_confirmed != 'true' }}
      env:
        TOPIC_HISTORY_COMMIT: 'true'
      run: python scripts/topic_history.py mark-published --file state/topic_history.json --episode state/current_episode.json
    - name: Check YouTube token age
      if: ${{ !inputs.dry_run && ((success() && inputs.dry_run != true) && steps.daily.outputs.already_confirmed != 'true') }}
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/check_youtube_token_age.py
    - name: Upload generated media artifacts
      if: ${{ (always() && hashFiles('output/final_video_full.mp4') != '') && steps.daily.outputs.already_confirmed != 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: true-horror-episode-media-${{ github.run_id }}-${{ env.PUBLISH_DATE }}-${{ env.PUBLISH_HOUR }}
        path: 'output/final_video_full.mp4

          state/current_episode.json

          '
        retention-days: 14
        if-no-files-found: error
    - name: Preserve clip review candidates
      if: ${{ (failure() && env.CINEMATIC_ENABLED != 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: clip-review-candidates-${{ env.PUBLISH_DATE }}-${{ env.PUBLISH_HOUR }}
        path: 'state/clip_review_requests.json

          state/clip_reviews.json

          state/cinematic_failures.json

          downloaded_clips/clip_*.mp4

          output/pexels_clips/raw_*

          '
        if-no-files-found: ignore
        retention-days: 3
    - name: Save inspected cinematic scenes even after a failed run
      if: ${{ (always() && env.CINEMATIC_ENABLED == 'true' && hashFiles('state/cinematic_scene_manifest.json') != '') && steps.daily.outputs.already_confirmed != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: .cinematic_cache
        key: cinematic-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PUBLISH_DATE }}-${{ env.PUBLISH_HOUR }}
    - name: Persist confirmed stock and production counters
      if: ${{ !inputs.dry_run && ((always()) && steps.daily.outputs.already_confirmed != 'true') }}
      run: "git config user.name 'content-bot'\ngit config user.email 'bot@users.noreply.github.com'\nfor path in state/publication_stock.json state/cinematic_budget.json state/yt_token_last_success.json state/used_clips.json; do\n  if [ -f \"$path\" ]; then git add \"$path\"; fi\ndone\nif git diff --cached --quiet; then exit 0; fi\ngit commit -m 'chore: persist publication receipts and counters [skip ci]'\nfor attempt in 1 2 3; do\n  if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi\n  sleep $((attempt * 5))\ndone\nexit 1\n"
    - name: Preserve cinematic storyboard and quality evidence
      if: ${{ (always() && env.CINEMATIC_ENABLED == 'true') && steps.daily.outputs.already_confirmed != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: cinematic-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PUBLISH_DATE }}-${{ env.PUBLISH_HOUR }}
        path: 'state/cinematic_storyboard.json

          state/cinematic_scene_manifest.json

          state/cinematic_quality_report.json

          state/cinematic_failures.json

          state/cinematic_budget.json

          state/publication_stock.json

          '
        if-no-files-found: ignore
        retention-days: 14
    - name: Preserve verified voices and API budget
      uses: actions/cache/save@v4
      if: ${{ always() && steps.daily.outputs.already_confirmed != 'true' }}
      with:
        path: '.voice_cache

          state/api_budget.sqlite3'
        key: voice-budget-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Preserve review narration and script
      if: ${{ always() && inputs.dry_run }}
      uses: actions/upload-artifact@v4
      with:
        name: review-evidence-${{ github.run_id }}
        path: 'state/current_episode.json

          state/prepared_narration.json

          output/narration.mp3

          output/narration.source.json

          downloaded_clips/narration.mp3

          downloaded_clips/narration.source.json

          downloaded_clips/narration_voice.source.json

          state/delivery_verification.json'
        if-no-files-found: ignore
        retention-days: 14
